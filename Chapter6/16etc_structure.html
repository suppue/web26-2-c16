<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>16etc_structure</title>
    <style>
        ul{overflow:hidden ;}
        li{
            list-style:none;
            float: left;padding: 15px;
        }
        li :first-child{border-radius: 10px 0 0 10px;}
        li:last-child{border-radius: 0 10px 10px 0;}
        li:nth-child(2n){background-color: #ff0003;}
        li:nth-child(2n+1){background-color: #800000;}
        
    </style>
</head>
<body>
        <ul>
            <li>첫 번쨰</li>
            <li>두 번쨰</li>
            <li>세 번쨰</li>
            <li>네 번쨰</li>
            <li>다섯 번쨰</li>
            <li>여섯 번쨰</li>
            <li>일곱 번쨰</li>
        </ul>
</body>
</html>
